name: Release and Build Docker Image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run tests
        id: test
        run: npm test
      - name: Notify on test failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const message = `❌ **Tests Failed on ${context.ref}**
            Commit: ${context.sha.substring(0, 7)}
            Author: ${context.payload.head_commit.author.name}
            Message: ${context.payload.head_commit.message}
            [View workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Test Failure: ${context.sha.substring(0, 7)}`,
              body: message,
              labels: ['test-failure', 'automated']
            });
  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      new-release-published: ${{ steps.semantic-release.outputs.new-release-published }}
      new-release-version: ${{ steps.semantic-release.outputs.new-release-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build site
        run: npm run build
      - name: Install semantic-release plugins
        run: |
          npm install --legacy-peer-deps --save-dev @semantic-release/changelog@6.0.3 @semantic-release/git@10.0.1 @semantic-release/github conventional-changelog-conventionalcommits
      - name: Semantic Release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          semantic_version: 24.2.7
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
            @semantic-release/github
            conventional-changelog-conventionalcommits
  build-docker:
    runs-on: ubuntu-latest
    needs: [test, release]
    if: github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, 'feat:') || contains(github.event.head_commit.message, 'fix:') || contains(github.event.head_commit.message, 'content:') || needs.release.outputs.new-release-published == 'true')
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get version from package.json or latest tag
        id: version
        run: |
          if [ "${{ needs.release.outputs.new-release-published }}" == "true" ]; then
            VERSION="${{ needs.release.outputs.new-release-version }}"
          else
            if [ -f package.json ]; then
              VERSION=$(node -p "require('./package.json').version")
            else
              VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/v//' || echo "0.0.1")
            fi
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Using version: ${VERSION}"
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix={{branch}}-
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.created=${{ github.event.repository.created_at }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Output final tags
        run: |
          echo "🐳 Docker image built and pushed with tags:"
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            echo "  - $tag"
          done
      - name: Notify on successful deployment
        uses: actions/github-script@v7
        with:
          script: |
            const message = `✅ **Deployment Successful**
            Version: v${{ steps.version.outputs.version }}
            Registry: ghcr.io/${{ github.repository }}
            [View workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            [View package](https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }})`;
            console.log(message);
  manual-bump:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[bump]')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      - name: Bump version
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[bump major]"* ]]; then
            npm version major
          elif [[ "${{ github.event.head_commit.message }}" == *"[bump minor]"* ]]; then
            npm version minor
          else
            npm version patch
          fi
      - name: Push changes
        run: |
          git push origin main --follow-tags
